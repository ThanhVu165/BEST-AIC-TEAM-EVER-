[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aic2026-video-retrieval"
version = "0.1.0"
description = "AIC 2026 Video Retrieval and Video Understanding system"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
ml = [
    "torch>=2.3",
    "torchvision>=0.18",
    "transformers>=4.44",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "opencv-python>=4.9",
]
ml-siglip = [
    "torch>=2.3",
    "torchvision>=0.18",
    "transformers>=4.44",
    "pillow>=10.0",
]
ml-vlm = [
    "torch>=2.3",
    "torchvision>=0.18",
    "transformers>=4.49",
    "accelerate>=0.34",
    "pillow>=10.0",
    "qwen-vl-utils>=0.0.8",
]
ml-video = [
    "torch>=2.3",
    "torchvision>=0.18",
    "transformers>=4.49",
    "accelerate>=0.34",
    "opencv-python>=4.9",
    "decord>=0.6.0",
]
api = [
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",
]
ui = [
    "streamlit>=1.37",
    "requests>=2.32",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "fastapi>=0.112",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["schemas*", "data_layer*", "video_pipeline*", "query_engine*", "api*", "ui*"]
